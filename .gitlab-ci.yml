include:
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/generate_version@$CI_COMMIT_SHA
    inputs:
      stage: tag
  - component: $CI_SERVER_FQDN/nci-gdc/gitlab-templates/pre-commit@feat/components
  - component: $CI_SERVER_FQDN/nci-gdc/gitlab-templates/tox@feat/components
    inputs:
      python_version: "3.12"
  - component: $CI_SERVER_FQDN/nci-gdc/gitlab-templates/docker-build@feat/components
  - component: $CI_SERVER_FQDN/nci-gdc/gitlab-templates/docker-release@feat/components
  - component: $CI_SERVER_FQDN/nci-gdc/gitlab-templates/docker-release-latest@feat/components

stages:
  - test
  - build
  - release
  - tag
