[build-system]
build-backend = "flit_scm:buildapi"
requires = [ "flit-scm" ]

[project]
name = "aliquot-maf-tools"
description = "Tools for creating and filtering aliquot-level MAFs"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Charles Czysz", email = "czysz@uchicago.edu" },
]
requires-python = ">=3.12"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
  "bioinf-maflib",
  "pysam",
]
optional-dependencies.build = [
  "flit",
  "setuptools-scm",
  "twine",
]
optional-dependencies.dev = [
  "black",
  "detect-secrets",
  "mypy",
  "pre-commit>=2.9",
  "ruff",
  "tox-uv",
]
optional-dependencies.test = [
  "coverage[toml]",
  "pytest",
]
optional-dependencies.type = []
urls.homepage = "https://github.com/NCI-GDC/aliquot-maf-tools"
scripts.aliquotmaf = "aliquotmaf.__main__:main"

[tool.setuptools_scm]
write_to = "aliquotmaf/_version.py"
local_scheme = "dirty-tag"
version_scheme = "python-simplified-semver"
fallback_version = "0"

[tool.flit]
module.name = "aliquotmaf"
sdist.include = [ "aliquotmaf/_version.py" ]
sdist.exclude = [
  ".*",
  "dev-requirements.*",
  "Dockerfile",
  "Jenkinsfile",
  "*travis.yml",
  "tox.ini",
]

[tool.uv]
extra-index-url = [ "https://nexus.osdc.io/repository/pypi-all/simple" ]
no-binary = true
no-binary-package = [ "pysam" ]
pip.emit-index-url = true
pip.extra-index-url = [ "https://nexus.osdc.io/repository/pypi-all/simple" ]
pip.no-binary = [ "pysam" ]
pip.output-file = "requirements.txt"

[tool.ruff]
target-version = "py312"
# Same as Black.
line-length = 88
indent-width = 4
# Exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
]
# Like Black, indent with spaces, rather than tabs.
format.indent-style = "space"
# Like Black, use double quotes for strings.
format.quote-style = "double"
# Like Black, automatically detect the appropriate line ending.
format.line-ending = "auto"
# Like Black, respect magic trailing commas.
format.skip-magic-trailing-comma = false
# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
format.docstring-code-line-length = "dynamic"
# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
format.docstring-code-format = false
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
lint.select = [ "E4", "E7", "E9", "F" ]
lint.ignore = [ "E501" ]
lint.per-file-ignores."__init__.py" = [ "E402" ]
# Allow autofix for all enabled rules (when `--fix`) is provided.
lint.fixable = [ "ALL" ]
lint.unfixable = []
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.mypy]
python_version = 3.12
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage]
run.branch = true
run.parallel = true
run.source = [ "aliquotmaf" ]
report.show_missing = true

[tool.tox]
requires = [ "tox-uv-bare" ]
env_list = [ "3.12" ]
env_run_base.description = "Run test under {base_python}"
env_run_base.runner = "uv-venv-lock-runner"
env_run_base.uv_sync_flags = [ "--no-binary-package", "pysam" ]
env_run_base.extras = [ "test" ]
env_run_base.commands = [ [ "pytest", "-vv" ] ]
