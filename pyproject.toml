[build-system]
build-backend = "flit_scm:buildapi"
requires = [ "flit-scm" ]

[project]
name = "aliquot-maf-tools"
description = "Tools for creating and filtering aliquot-level MAFs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
  "bioinf-maflib",
  "pysam==0.21.0",
]
[[project.authors]]
name = "Charles Czysz"
email = "czysz@uchicago.edu"
[project.optional-dependencies]
build = [
  "flit",
  "setuptools-scm",
  "twine",
]
dev = [
  "black",
  "detect-secrets",
  "mypy",
  "pre-commit>=2.9",
  "ruff",
  "tox-uv",
]
test = [
  "pytest",
]
type = []
[project.scripts]
aliquotmaf = "aliquotmaf.__main__:main"
[project.urls]
homepage = "https://github.com/NCI-GDC/aliquot-maf-tools"

[tool.setuptools_scm]
write_to = "aliquotmaf/_version.py"
local_scheme = "dirty-tag"
version_scheme = "python-simplified-semver"
fallback_version = "0"

[tool.flit]
[tool.flit.module]
name = "aliquotmaf"
[tool.flit.sdist]
include = [ "aliquotmaf/_version.py" ]
exclude = [
  ".*",
  "dev-requirements.*",
  "Dockerfile",
  "Jenkinsfile",
  "*travis.yml",
  "tox.ini",
]

[tool.uv]
extra-index-url = [ "https://nexus.osdc.io/repository/pypi-all/simple" ]
no-binary = true
[tool.uv.pip]
extra-index-url = [ "https://nexus.osdc.io/repository/pypi-all/simple" ]
no-binary = [ ":all:" ]
emit-index-url = true
output-file = "requirements.txt"

[tool.ruff]
target-version = "py312"
# Same as Black.
line-length = 88
indent-width = 4
# Exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
]
[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-line-length = "dynamic"
docstring-code-format = false
[tool.ruff.lint]
select = [ "E4", "E7", "E9", "F" ]
ignore = [ "E501" ]
per-file-ignores."__init__.py" = [ "E402" ]
fixable = [ "ALL" ]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.pyproject-fmt]
table_format = "long"

[tool.mypy]
python_version = 3.12
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage]
[tool.coverage.report]
show_missing = true
[tool.coverage.run]
branch = true
parallel = true
source = [ "aliquotmaf" ]
