[tox]
envlist = py312,help,cov
isolated_build = true
minversion = 4.0

[tox:.package]
basepython = python3.12

[testenv]
runner = uv-venv-lock-runner
setenv = 
	package = aliquotmaf
	PYTHONHASHSEED = 0
passenv =
    PIP_*
skip_install = false
uv_sync_flags = --no-binary
extras = test
commands = pytest -vv {posargs}

[testenv:dev]
extras =
	dev
	test

[testenv:detect-secrets]
deps =
  detect-secrets==1.5.0
skip_install = true
commands =
  detect-secrets scan > .secrets.baseline

[testenv:compile]
deps = uv
skip_install = true
commands =
  uv pip compile -o requirements.txt pyproject.toml

[testenv:help]
skip_install = false
runner = uv-venv-lock-runner
uv_sync_flags = --no-binary
uv_python_preference = only-managed
commands =
	python -m {env:package} --help

[testenv:cov]
extras = test
runner = uv-venv-lock-runner
uv_sync_flags = --no-binary
uv_python_preference = only-managed
commands =
	uv run coverage run -m pytest tests/
	uv run coverage combine
	uv run coverage report -m
	uv run coverage xml
	uv run coverage xml -o test-reports/results.xml
ignore_outcome = true

[testenv:ruff]
skip_install = false
deps = ruff
commands = 
	ruff check {env:package}/ tests/

[testenv:type]
skip_install = false
deps =
  mypy
extras = type
commands =
	mypy {env:package}/
ignore_outcome = true

[testenv:build]
skip_install = false
isolated_build = false
extras = build
commands = 
	python -m setuptools_scm
	uv run flit build

[testenv:publish]
isolated_build = false
allowlist_externals = just
skip_install = false
passenv =
	TWINE_USERNAME
	TWINE_PASSWORD
	TWINE_REPOSITORY_URL
extras = build
commands = 
	uv run setuptools_scm
	uv run flit build
	twine check dist/*
	twine upload dist/*

[testenv:version]
skip_install = True
allowlist_externals =
  git
deps =
commands = 
  git describe --tags --always

[testenv:cruft]
skip_install = True
deps = cruft
allowlist_externals =
  git
commands = 
  cruft check
